<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sober Hub | Daily Check-in</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="app-header"><a class="brand" href="index.html"><span class="logo">SH</span>Sober Hub</a><div style="display:flex;gap:10px;align-items:center"><a class="back" href="dashboard.html">← Dashboard</a><button class="btn outline" id="logoutBtn">Log out</button></div></header><main class="page"><span class="eyebrow">MEMBER ACTIVITY</span><h1>Daily Check-in</h1><p class="page-intro">Take a moment to reflect and track your activity.</p><section class="form"><h3>How are you feeling today?</h3><div class="moods"><label class="mood"><input type="radio" name="mood" value="Great"><span>😊</span>Great</label><label class="mood"><input type="radio" name="mood" value="Good"><span>🙂</span>Good</label><label class="mood"><input type="radio" name="mood" value="Okay"><span>😐</span>Okay</label><label class="mood"><input type="radio" name="mood" value="Struggling"><span>😔</span>Struggling</label></div><label>What would help you today?<textarea id="note" rows="4" placeholder="Write a short reflection..."></textarea></label><button class="btn primary" id="saveCheckin">Save Check-in</button></section><section class="dashcard" style="margin-top:18px"><h3>Recent check-in</h3><div id="recent" class="muted">No check-in saved in this browser yet.</div></section></main><script src="assets/app.js"></script></body></html>
