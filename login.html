<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sober Hub | Login</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="header"><a class="brand" href="index.html"><span class="logo">SH</span>Sober Hub</a><a class="btn outline" href="register.html">Create account</a></header><main class="auth-page"><section class="auth-card"><span class="eyebrow">MEMBER & STAFF ACCESS</span><h1>Welcome back</h1><p class="muted">Log in to access your Sober Hub account.</p><form id="loginForm" class="form"><label>Email address<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><div class="password-row"><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button type="button" class="btn outline password-toggle" data-toggle-password="password">Show</button></div><button class="btn primary" type="submit">Log In</button><p id="msg" class="form-msg"></p></form><div class="auth-links"><a class="text-link" href="forgot-password.html">Forgot your password?</a><button type="button" id="resendVerification" class="link-button">Resend verification email</button></div><p class="small">New to Sober Hub? <a class="text-link" href="register.html">Create an account</a></p></section></main><script src="assets/app.js"></script></body></html>
