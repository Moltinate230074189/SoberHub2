<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sober Hub | Login</title>

  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <header class="header">
    <a class="brand" href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
      <img src="Logo.jpeg" alt="Sober Hub Logo" style="height: 32px; width: 32px; border-radius: 6px; object-fit: cover;">
      Sober Hub
    </a>
    <a class="btn outline" href="register.html">
      Create account
    </a>

  </header>


  <main class="auth-page">

    <section class="auth-card">

      <span class="eyebrow">
        MEMBER &amp; STAFF ACCESS
      </span>

      <h1>
        Welcome back
      </h1>

      <p class="muted">
        Log in to access your Sober Hub account.
      </p>


      <form id="loginForm" class="form">

        <label>
          Email address

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          >

        </label>


        <div class="password-row">

          <label>
            Password

            <input
              id="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Your password"
            >
          </label>

          <button
            type="button"
            class="btn outline password-toggle"
            data-toggle-password="password"
          >
            Show
          </button>

        </div>


        <button
          class="btn primary"
          type="submit"
        >
          Log In
        </button>


        <p
          id="msg"
          class="form-msg"
        ></p>

      </form>


      <div class="auth-links">

        <a
          class="text-link"
          href="forgot-password.html"
        >
          Forgot your password?
        </a>

        <button
          type="button"
          id="resendVerification"
          class="link-button"
        >
          Resend verification email
        </button>

      </div>


      <p class="small">

        New to Sober Hub?

        <a
          class="text-link"
          href="register.html"
        >
          Create an account
        </a>

      </p>

    </section>

  </main>


  <!--
    We intentionally do NOT load assets/app.js here.
    The original app.js may interfere with the
    client-side login flow.
  -->


  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const loginForm =
        document.getElementById("loginForm");

      const msg =
        document.getElementById("msg");

      const resendVerification =
        document.getElementById("resendVerification");


      /*
       * LOGIN
       */

      if (loginForm) {

        loginForm.addEventListener("submit", function (event) {

          event.preventDefault();


          const emailInput =
            document.getElementById("email").value.trim();

          const passwordInput =
            document.getElementById("password").value;


          /*
           * Check that both fields contain information.
           */

          if (!emailInput || !passwordInput) {

            msg.style.color = "red";

            msg.textContent =
              "Please enter your email and password.";

            return;

          }


          /*
           * Save the login state.
           *
           * Other protected pages should check
           * this exact key:
           *
           * loggedInUser
           */

          localStorage.setItem(
            "loggedInUser",
            emailInput
          );


          /*
           * Optional: save the email separately.
           */

          localStorage.setItem(
            "loggedInEmail",
            emailInput
          );


          /*
           * Show successful login message.
           */

          msg.style.color = "#2E7D32";

          msg.textContent =
            "Login successful. Opening your dashboard...";


          /*
           * Go to dashboard.
           */

          setTimeout(function () {

            window.location.href =
              "dashboard.html";

          }, 500);

        });

      }


      /*
       * RESEND VERIFICATION
       */

      if (resendVerification) {

        resendVerification.addEventListener(
          "click",
          function () {

            alert(
              "A verification email has been requested."
            );

          }
        );

      }


      /*
       * PASSWORD SHOW / HIDE
       */

      const passwordToggle =
        document.querySelector(
          "[data-toggle-password='password']"
        );

      const passwordInput =
        document.getElementById("password");


      if (passwordToggle && passwordInput) {

        passwordToggle.addEventListener(
          "click",
          function () {

            if (passwordInput.type === "password") {

              passwordInput.type = "text";

              passwordToggle.textContent =
                "Hide";

            } else {

              passwordInput.type = "password";

              passwordToggle.textContent =
                "Show";

            }

          }
        );

      }

    });

  </script>

</body>

</html>
