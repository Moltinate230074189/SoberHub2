<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sober Hub | Sign up</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="header"><a class="brand" href="index.html"><span class="logo">SH</span>Sober Hub</a><a class="btn outline" href="login.html">Log in</a></header><main class="auth-page"><section class="auth-card signup-card"><span class="eyebrow">CREATE YOUR ACCOUNT</span><h1>Sign up</h1><p class="muted">Join Sober Hub and access support, skills and community.</p><div class="role-tabs" role="tablist"><button type="button" class="role-tab active" data-role-tab="member">Member</button><button type="button" class="role-tab" data-role-tab="staff">Staff</button></div><form id="registerForm" class="form" novalidate><div class="formgrid"><label>Full name<input id="fullName" required autocomplete="name" placeholder="e.g. Aphiwe S..." /></label><label>Phone number<input id="phone" type="tel" autocomplete="tel" placeholder="e.g. 071 234 5678" /></label><label>Email address<input id="regEmail" type="email" required autocomplete="email" placeholder="you@example.com" /></label><label>Confirm email<input id="confirmEmail" type="email" required autocomplete="email" placeholder="Re-enter your email" /></label></div><div id="staffPanel" class="staff-panel" hidden><b>Staff registration</b><p class="muted">Staff accounts require an authorised registration code.</p><label>Staff registration code<input id="staffCode" autocomplete="off" placeholder="Enter staff code" /></label></div><div class="password-row"><label>Password<input id="regPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters" /></label><button type="button" class="btn outline password-toggle" data-toggle-password="regPassword">Show</button></div><div class="strength"><div id="passwordStrength"></div></div><small id="passwordStrengthText" class="muted"></small><div class="password-row"><label>Confirm password<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password" placeholder="Confirm password" /></label><button type="button" class="btn outline password-toggle" data-toggle-password="confirmPassword">Show</button></div><label class="checkline"><input id="terms" type="checkbox" required><span>I agree to the <a href="#" class="text-link">Terms of Service</a> and <a href="#" class="text-link">Privacy Policy</a>.</span></label><button class="btn primary" type="submit">Create Account</button><p id="msg" class="form-msg"></p></form><p class="small">Already have an account? <a class="text-link" href="login.html">Log in</a></p></section></main><script src="assets/app.js"></script></body></html>
