<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sober Hub | Settings</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="app-header"><a class="brand" href="index.html"><span class="logo">SH</span>Sober Hub</a><div style="display:flex;gap:10px;align-items:center"><a class="back" href="dashboard.html">← Dashboard</a><button class="btn outline" id="logoutBtn">Log out</button></div></header><main class="page"><span class="eyebrow">ACCOUNT</span><h1>Settings</h1><p class="page-intro">Manage your communication preferences and account security.</p><section class="form"><label>Mentor notifications <input type="checkbox" checked></label><label>Training reminders <input type="checkbox" checked></label><label>Community updates <input type="checkbox" checked></label><label>Privacy mode <input type="checkbox"></label></section><section class="dashcard" style="margin-top:22px"><h3>Change password</h3><form id="changePasswordForm" class="form" style="padding:0;border:0;box-shadow:none"><div class="password-row"><label>Current password<input id="currentPassword" type="password" required autocomplete="current-password"></label><button type="button" class="btn outline password-toggle" data-toggle-password="currentPassword">Show</button></div><div class="password-row"><label>New password<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label><button type="button" class="btn outline password-toggle" data-toggle-password="newPassword">Show</button></div><div class="password-row"><label>Confirm new password<input id="confirmNewPassword" type="password" minlength="8" required autocomplete="new-password"></label><button type="button" class="btn outline password-toggle" data-toggle-password="confirmNewPassword">Show</button></div><button class="btn primary" type="submit">Change Password</button><p id="settingsMsg" class="form-msg"></p></form></section><section class="dashcard" style="margin-top:22px"><h3>About this version</h3><p class="muted">Sober Hub is connected to a Vercel serverless backend and Neon PostgreSQL. Passwords are hashed before storage and sessions use an HTTP-only cookie.</p></section></main><script src="assets/app.js"></script></body></html>
